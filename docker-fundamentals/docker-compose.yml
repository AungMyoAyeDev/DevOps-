services:
  app:
    build:
      context: .
      target: production
    container_name: docker-fundamentals-api
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGO_URL: mongodb://mongo:27017/docker-fundamentals

  mongo:
    image: mongo:8
    container_name: docker-fundamentals-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
