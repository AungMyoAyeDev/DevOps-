services:
  api:
    build:
      context: ./api
    container_name: api-con

  mongo:
    image: mongo
    container_name: mongo

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
