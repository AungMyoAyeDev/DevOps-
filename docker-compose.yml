services:
  api:
    build:
      context: ./api

    env_file:
      - .env

    restart: unless-stopped
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    restart: unless-stopped

    volumes:
      - mongo-data:/data/db

  # frontend:
  #   build:
  #     context: ./client
  #   restart: unless-stopped

  nginx:
    build:
      context: .

    ports:
      - "80:80"

    depends_on:
      - api
    restart: unless-stopped
volumes:
  mongo-data:
