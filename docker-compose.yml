services:
  backend:
    build:
      context: ./api
    container_name: express_api

    env_file:
      - .env

    restart: unless-stopped
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    restart: unless-stopped

    volumes:
      - mongo-data:/data/db
  frontend:
    build:
      context: ./client
    container_name: client
    ports:
      - "80:80"

    depends_on:
      - backend
    restart: unless-stopped
volumes:
  mongo-data:
