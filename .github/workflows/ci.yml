name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Show os
        run: uname -a
      - name: show current directory
        run: pwd
      - name: show files
        run: ls -la
      - uses: actions/checkout@v4
      - run: ls -la
